[settings]
dotfiles.default_mode = "symlink"

[dotfiles]
"~/.codex/config.toml" = { source = "config/codex/config.toml" }
"~/.config/mise/config.toml" = { source = "config/mise/config.toml" }
"~/.config/sheldon/plugins.toml" = { source = "config/sheldon/plugins.toml" }
"~/.config/starship.toml" = { source = "config/starship.toml" }
"~/.gitconfig" = { source = "config/git/.gitconfig" }
"~/.warp/settings.toml" = { source = "config/warp/settings.toml" }
"~/.zshrc" = { source = "config/zsh/.zshrc" }
"~/Library/Application Support/Code/User/settings.json" = { source = "config/vscode/settings.json" }

[tasks.bootstrap]
description = "opam and ghcup"
run = """
opam switch import opam.export
ghcup install ghc 9.14.1
ghcup install hls 2.14.0.0
"""
